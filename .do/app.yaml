name: nl-to-sql-bot
region: nyc

services:
  - name: telegram-bot
    github:
      repo: your-username/nl-to-sql-agent
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    
    envs:
      # Anthropic API Key
      - key: ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      
      # Database Configuration
      - key: DB_HOST
        scope: RUN_TIME
        type: SECRET
      - key: DB_PORT
        scope: RUN_TIME
        value: "5432"
      - key: DB_NAME
        scope: RUN_TIME
        type: SECRET
      - key: DB_USER
        scope: RUN_TIME
        type: SECRET
      - key: DB_PASSWORD
        scope: RUN_TIME
        type: SECRET
      
      # Telegram Bot Configuration
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TELEGRAM_ALLOWED_USERS
        scope: RUN_TIME
        value: ""
      
      # Agent Configuration
      - key: MAX_RETRIES
        scope: RUN_TIME
        value: "3"
      - key: QUERY_TIMEOUT
        scope: RUN_TIME
        value: "30"
      - key: DEFAULT_LIMIT
        scope: RUN_TIME
        value: "100"
